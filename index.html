<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
        }
        .list-item {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1> Remember</h1>
    <p>Твое личное хранилище в Telegram</p>
    
    <button class="btn" onclick="sendToBot('save')">💾 Сохранить последнее</button>
    <button class="btn" onclick="sendToBot('list')"> Мои заметки</button>
    <button class="btn" onclick="sendToBot('help')">❓ Помощь</button>

    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        function sendToBot(action) {
            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify({ action: action }));
            document.getElementById('status').innerText = "Отправлено боту!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        }
    </script>
</body>
</html>
