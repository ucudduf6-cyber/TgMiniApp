name: Business Monitor & Site Update

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install aiogram aiosqlite

      - name: Run Bot and Export Data
        run: |
          echo "Starting bot..."
          timeout 240 python main.py || true
          
          echo "Exporting database..."
          python export_db.py || true
          
          echo "Updating site..."
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add logs.json
          git commit -m "Auto update logs" || echo "No changes"
          git push || echo "Push failed"
