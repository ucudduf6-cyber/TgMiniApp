      - name: Export DB to JSON
        run: |
          python -c "
          import sqlite3, json
          conn = sqlite3.connect('business_logs.db')
          c = conn.cursor()
          c.execute('SELECT * FROM events ORDER BY timestamp DESC LIMIT 100')
          rows = c.fetchall()
          # Превращаем кортежи в списки для JSON
          data = [list(row) for row in rows]
          with open('logs.json', 'w') as f:
              json.dump(data, f)
          conn.close()
          print('JSON создан')
          "
      
      - name: Commit and Push JSON
        run: |
          git config --global user.name 'BotBuilder'
          git config --global user.email 'bot@example.com'
          git add logs.json
          git commit -m "Update logs" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
