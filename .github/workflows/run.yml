name: Keep Bot Alive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *' # Запускает каждые 15 минут автоматически
  workflow_dispatch: # Позволяет запустить вручную (если появится кнопка)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        run: |
          echo "Запуск бота Remember..."
          timeout 600 python main.py
          echo "Время работы истекло, ожидание следующего запуска."
