<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Monitor Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .log-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #3498db; }
        .log-item.DELETE { border-left-color: #e74c3c; }
        .log-item.EDIT { border-left-color: #f1c40f; }
        .log-item.JOIN { border-left-color: #2ecc71; }
        .meta { font-size: 0.8em; color: #7f8c8d; margin-bottom: 5px; }
        .content { font-weight: bold; }
        .refresh { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ Мониторинг Чата</h1>
        <p>Журнал действий пользователей</p>
    </div>
    
    <button class="refresh" onclick="loadLogs()">🔄 Обновить данные</button>
    <div id="logs-container"></div>

    <script>
        // Ссылка на JSON файл с логами (который мы сгенерируем)
        const DATA_URL = "https://твой-ник.github.io/remember-bot/logs.json?t=" + new Date().getTime();

        async function loadLogs() {
            const container = document.getElementById('logs-container');
            container.innerHTML = "Загрузка...";

            try {
                const res = await fetch(DATA_URL);
                if (!res.ok) throw new Error("Нет данных");
                const data = await res.json();

                container.innerHTML = "";
                if (data.length === 0) {
                    container.innerHTML = "<p>Логи пусты.</p>";
                    return;
                }

                data.forEach(item => {
                    // item: [id, chat_id, type, user_id, user_name, content, time]
                    const div = document.createElement('div');
                    div.className = `log-item ${item[2]}`;
                    div.innerHTML = `
                        <div class="meta">⏰ ${new Date(item[6]).toLocaleString()} | 👤 ${item[4]} (ID: ${item[3]})</div>
                        <div class="meta">Тип: ${item[2]}</div>
                        <div class="content">${item[5]}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p style='color:red'>Ошибка загрузки. Проверьте, обновился ли logs.json.</p>";
            }
        }

        loadLogs();
        // Автообновление каждые 30 сек
        setInterval(loadLogs, 30000);
    </script>
</body>
</html>
